<main>

<h1>Contact</h1>

<p>Send a message and I will reply by email.</p>

<form id="contact" novalidate>

<div>
<label for="name">Name</label>
<input id="name" autocomplete="name">
<div class="err" id="e-name"></div>
</div>

<div>
<label for="email">Email</label>
<input id="email" type="email" autocomplete="email">
<div class="err" id="e-email"></div>
</div>

<div>
<label for="msg">Message</label>
<textarea id="msg" rows="5"></textarea>
<div class="err" id="e-msg"></div>
</div>

<div>
<button class="btn" type="submit">Send message</button>
</div>

</form>

<div id="ok" role="status">
Message validated. To receive messages, connect this form to a service such as Formspree or Netlify Forms.
</div>
